name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-v2-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-v2-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Set up test SQLite schema
        run: |
          mkdir -p prisma/db
          bunx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Lint
        run: bun run lint
        timeout-minutes: 3

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 3

      - name: Tests
        run: bun run test
        timeout-minutes: 5
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Build
        run: bun run build
        timeout-minutes: 5
