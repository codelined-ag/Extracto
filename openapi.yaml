openapi: 3.1.0
info:
  title: Extracto v1 API
  version: 0.11.0
  description: |
    Stable bearer-auth HTTP surface for Extracto. Mint a key with
    `extracto api-key create <user-email> <name>` (or `POST /api/v1/keys`
    via session auth), then send it as `Authorization: Bearer <key>` on
    every call below.

    Mutation endpoints additionally require a same-origin `Origin` header
    that matches the request URL (CSRF-style).
  license:
    name: MIT
    url: https://github.com/codelined-ag/extracto/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: Local Docker
  - url: https://extracto.example.com
    description: Production

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: extr_*
    metricsBearer:
      type: http
      scheme: bearer
      description: Separate token, set via `METRICS_TOKEN` env.

  schemas:
    OcrJob:
      type: object
      required: [id, status, fileName, model, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
        fileName: { type: string }
        sourcePreview: { type: string, nullable: true }
        model: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        processingMs: { type: integer, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          description: |
            Job metadata. Since v0.9.0 includes a `document` sub-object when first-page
            heuristics detect any of: `title`, `date`, `authors[]`, `keywords[]`. May
            also include a `documentType` sub-object `{ kind, confidence }` where `kind`
            is one of `invoice`, `receipt`, `contract`, `academic`, `form`, `id`, or
            `generic`. Only emitted when the heuristic confidence exceeds the gate.
        errorMessage: { type: string, nullable: true }
        extractedText: { type: string, nullable: true }
        result:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Full OCR result. `result.structured.pages[]` carries per-page entries.
            Since v0.9.0, each page entry includes `language` (ISO 639-3) and
            `languageName` (English name) when language detection succeeded.
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    SavedSearchFilters:
      type: object
      properties:
        q: { type: string }
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
        from: { type: string }
        to: { type: string }
        model: { type: string }
        tagIds:
          type: array
          items: { type: string }

    SavedSearch:
      type: object
      required: [id, name, filters]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 64 }
        filters: { $ref: "#/components/schemas/SavedSearchFilters" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 32 }
        color:
          type: string
          enum: [slate, blue, green, yellow, orange, red, pink, purple]
        createdAt: { type: string, format: date-time }
        jobCount: { type: integer, description: "Only present in tags list responses" }

    CompareRequest:
      type: object
      required: [fileName, preview, models]
      properties:
        fileName: { type: string }
        preview: { type: string, description: "Data URL." }
        models:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string }
        pages:
          type: array
          items: { type: string }
        pageNumbers:
          type: array
          items: { type: integer, minimum: 1 }
        sourcePdf: { type: string }

    CompareResponse:
      type: object
      required: [comparisonId, jobs]
      properties:
        comparisonId: { type: string }
        jobs:
          type: array
          items:
            type: object
            properties:
              model: { type: string }
              jobId: { type: string }
        failures:
          type: array
          items:
            type: object
            properties:
              model: { type: string }
              error: { type: string }

    DiffSegment:
      type: object
      properties:
        op: { type: string, enum: [equal, insert, delete] }
        text: { type: string }

    DiffSummary:
      type: object
      properties:
        equalChars: { type: integer }
        insertedChars: { type: integer }
        deletedChars: { type: integer }
        similarity: { type: number }

    CompareGetResponse:
      type: object
      required: [comparisonId, jobs]
      properties:
        comparisonId: { type: string }
        jobs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              model: { type: string }
              status: { type: string }
              extractedText: { type: string, nullable: true }
              processingMs: { type: integer, nullable: true }
              completedAt: { type: string, format: date-time, nullable: true }
              errorMessage: { type: string, nullable: true }
        diffs:
          type: array
          nullable: true
          items:
            type: object
            properties:
              baselineJobId: { type: string }
              candidateJobId: { type: string }
              segments:
                type: array
                items: { $ref: "#/components/schemas/DiffSegment" }
              summary: { $ref: "#/components/schemas/DiffSummary" }

    OcrEstimateRequest:
      type: object
      required: [files, model]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [pageCount]
            properties:
              fileName: { type: string }
              pageCount: { type: integer, minimum: 1, maximum: 5000 }
        model: { type: string, description: "Model id used for OCR." }
        provider:
          type: string
          enum: [ollama, mistral, openrouter, openai_compat]
          description: "Defaults to the caller's saved provider if omitted."
        apiEndpoint:
          type: string
          description: "Defaults to the caller's saved endpoint if omitted."
        postProcessing:
          type: object
          properties:
            enabled: { type: boolean }
            model: { type: string }
            outputFormat: { type: string, enum: [markdown, json] }
        outputTokensPerPage:
          type: integer
          minimum: 0
          description: "Override the 800 tokens/page output heuristic."
        inputTokensPerPage:
          type: integer
          minimum: 0
          description: "Override the 1445 tokens/page input heuristic (used only when the model has no flat per-image rate)."

    OcrCostBreakdown:
      type: object
      properties:
        inputCost: { type: number }
        outputCost: { type: number }
        imageCost: { type: number }
        flatRequestCost: { type: number }
        perPageRate: { type: number }
        totalCost: { type: number }
        pageCount: { type: integer }
        inputTokensPerPage: { type: integer }
        outputTokensPerPage: { type: integer }
        pricing:
          type: object
          properties:
            inputCostPerToken: { type: number }
            outputCostPerToken: { type: number }
            inputCostPerImage: { type: number }
            inputCostPerPage: { type: number }
            flatPerRequest: { type: number }
            source:
              type: string
              enum: [openrouter-live, mistral-static, litellm-mirror, ollama-local, user-override, unknown]
            lastVerified: { type: string }
            warnings:
              type: array
              items: { type: string }

    OcrEstimateResponse:
      type: object
      required: [currency, totalPages, total, perPage, ocr, files, assumptions, warnings]
      properties:
        currency: { type: string, enum: [USD] }
        totalPages: { type: integer }
        total: { type: number }
        perPage: { type: number }
        ocr: { $ref: "#/components/schemas/OcrCostBreakdown" }
        postProcessing:
          oneOf:
            - { $ref: "#/components/schemas/OcrCostBreakdown" }
            - { type: "null" }
        files:
          type: array
          items:
            type: object
            properties:
              fileName: { type: string }
              pageCount: { type: integer }
              cost: { $ref: "#/components/schemas/OcrCostBreakdown" }
        assumptions:
          type: object
          properties:
            outputTokensPerPage: { type: integer }
            inputTokensPerPage: { type: integer }
            postProcessingOutputTokensPerPage: { type: integer }
        warnings:
          type: array
          items: { type: string }

    BatchSubmission:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [fileName, model, preview]
            properties:
              fileName: { type: string }
              model: { type: string }
              preview:
                type: string
                description: Data URL (data:image/* or data:application/pdf).
              priority:
                type: integer
                minimum: -10
                maximum: 10
              settings: { $ref: "#/components/schemas/AdvancedSettings" }
              postProcessing: { $ref: "#/components/schemas/PostProcessingSettings" }

    BatchResponse:
      type: object
      required: [batchId, submissions]
      properties:
        batchId: { type: string }
        submissions:
          type: array
          items:
            type: object
            required: [fileName]
            properties:
              fileName: { type: string }
              jobId:
                type: string
                nullable: true
                description: Present when the per-file submit succeeded.
              error:
                type: string
                description: Present when the per-file submit failed.

    AdvancedSettings:
      type: object
      properties:
        language: { type: string, default: auto }
        tableDetection: { type: boolean, default: true }
        handwritingRecognition: { type: boolean, default: false }
        preserveFormatting: { type: boolean, default: true }
        customPrompt: { type: string }
        quality: { type: integer, minimum: 0, maximum: 100, default: 80 }

    PostProcessingTemplate:
      type: string
      enum: [custom, translate, summarize-3sentence, summarize-executive, extract-actions]
      description: |
        Server-built post-processing instruction.
        - custom: use the free-form `instruction` field
        - translate: requires `targetLanguage`; server builds a translation instruction
        - summarize-3sentence: 3-sentence overview
        - summarize-executive: short executive paragraph
        - extract-actions: bullet list of action items

    PostProcessingSettings:
      type: object
      properties:
        enabled: { type: boolean }
        instruction: { type: string, maxLength: 6000 }
        outputFormat:
          type: string
          enum: [markdown, json]
          default: markdown
        model: { type: string }
        template: { $ref: "#/components/schemas/PostProcessingTemplate" }
        targetLanguage:
          type: string
          maxLength: 80
          description: Target language for the 'translate' template. Ignored otherwise.

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        rateLimitPerMinute: { type: integer, nullable: true }
        totalRequests: { type: integer }
        requestsThisMonth: { type: integer }
        monthlyResetAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Preset:
      type: object
      required: [id, name, instruction, outputFormat, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        instruction: { type: string, maxLength: 6000 }
        outputFormat: { type: string, enum: [markdown, json] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Webhook:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum: [job.completed, job.failed]
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    KbExportRequest:
      type: object
      required: [jobId, collectionName, vectorStore, embedding, chunking]
      properties:
        jobId: { type: string }
        collectionName: { type: string }
        vectorStore:
          type: object
          required: [kind, baseUrl]
          properties:
            kind: { type: string, enum: [chroma, qdrant, weaviate] }
            baseUrl: { type: string, format: uri }
            apiKey: { type: string }
            dimensions: { type: integer, minimum: 1 }
        embedding:
          type: object
          required: [provider, apiEndpoint, model]
          properties:
            provider:
              type: string
              enum: [ollama, openrouter, openai_compat]
            apiEndpoint: { type: string, format: uri }
            apiKey: { type: string }
            model: { type: string }
            dimensions: { type: integer, minimum: 1 }
        chunking:
          type: object
          required: [strategy, maxChunkSize]
          properties:
            strategy:
              type: string
              enum: [fixed, sentence, paragraph, hierarchical, semantic]
              description: |
                * `fixed` — char-window with optional overlap.
                * `sentence` — split on sentence-end punctuation, merge until size.
                * `paragraph` — split on blank lines, merge until size.
                * `hierarchical` — markdown-heading aware: each chunk inherits its parent heading breadcrumb (`headingPath`, `headingLevel` in chunk metadata).
                * `semantic` — embed every sentence once, find boundaries where consecutive cosine distance exceeds `breakpointPercentile`. Most expensive (one extra embedding round) but the boundaries follow topic shifts rather than character offsets.
            maxChunkSize: { type: integer, minimum: 1, maximum: 10000 }
            overlap: { type: integer, minimum: 0, description: "Fixed-strategy only. Char overlap between adjacent chunks." }
            minChunkSize:
              type: integer
              minimum: 0
              description: "Sentence / paragraph / hierarchical: tail chunks shorter than this get merged into the previous one. Must be <= maxChunkSize. Ignored by the fixed and semantic strategies."
            breakpointPercentile:
              type: number
              minimum: 0
              maximum: 100
              default: 95
              description: "Semantic only. Percentile (0..100) of consecutive sentence-pair cosine distances above which a boundary is created."
            maxHeadingDepth:
              type: integer
              minimum: 1
              maximum: 6
              default: 6
              description: "Hierarchical only. Maximum markdown heading depth (1..6) to honor as a section boundary. Deeper headings get folded into the parent's body."

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    OpenAIError:
      type: object
      required: [error]
      description: |
        Error envelope used exclusively by `/api/v1/openai/chat/completions`.
        Mirrors OpenAI's own error shape so OpenAI-SDK clients can parse it
        without special-casing.
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type:
              type: string
              enum: [authentication_error, api_error, invalid_request_error, permission_error, rate_limit_error]

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Per-key or per-IP rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - bearer: []

paths:
  /api/v1/ocr/batch:
    post:
      summary: Submit one or more OCR jobs in a single batch
      operationId: submitOcrBatch
      tags: [OCR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchSubmission" }
      responses:
        "200":
          description: Batch accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/ocr/compare:
    post:
      summary: Run the same input through 2 to 4 models in parallel
      operationId: submitOcrComparison
      tags: [OCR]
      description: |
        Fans out one input to multiple model variants under a shared
        comparisonId. Use GET /api/v1/ocr/compare?id=<id> to fetch the
        per-model results plus a server-computed word-level diff
        between the first (baseline) job and each other completed job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompareRequest" }
      responses:
        "200":
          description: All model variants accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareResponse" }
        "207":
          description: Partial success (some variants failed to submit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      summary: Fetch a comparison's per-model results and word-level diff
      operationId: getOcrComparison
      tags: [OCR]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareGetResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ocr/estimate:
    post:
      summary: Estimate OCR cost for a batch before running it
      operationId: estimateOcrCost
      tags: [OCR]
      description: |
        Returns a dollar estimate for running OCR on the supplied page
        counts with a given provider + model. Pricing is fetched live
        from OpenRouter for OpenRouter models, the LiteLLM community
        registry for OpenAI-compatible models, and a static table for
        Mistral OCR (which has no pricing API). Ollama always returns
        $0. Self-hosted endpoints with no mirror entry return $0 plus a
        warning so the caller knows the estimate excludes provider cost.

        The response includes per-file breakdowns, ocr/postProcessing
        sub-totals, and the assumed input/output tokens per page so
        callers can override the heuristic when they have better data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OcrEstimateRequest" }
      responses:
        "200":
          description: Estimate computed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OcrEstimateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/jobs/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum: [md, json, txt, html, docx, rtf, csv, xlsx, obsidian]
          default: md
    get:
      summary: Render a COMPLETED job to a downloadable file
      operationId: exportOcrJob
      tags: [OCR]
      description: |
        Returns the job's text rendered to the requested format. CSV
        and XLSX surface markdown tables as structured rows (XLSX puts
        each table on its own sheet); prose-only documents fall back
        to a single text-dump sheet. RTF/DOCX/HTML render full
        formatting (headings, paragraphs, lists, tables). Only works
        on COMPLETED jobs.
      responses:
        "200":
          description: |
            File body. The `Content-Type` varies by format:
            md=text/markdown, json=application/json, txt=text/plain, html=text/html,
            rtf=application/rtf, csv=text/csv,
            docx=application/vnd.openxmlformats-officedocument.wordprocessingml.document,
            xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.
            All variants set Content-Disposition: attachment; filename="...".
          content:
            text/markdown: { schema: { type: string } }
            application/json: { schema: { type: object } }
            text/plain: { schema: { type: string } }
            text/html: { schema: { type: string } }
            application/rtf: { schema: { type: string } }
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Job not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Job not COMPLETED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Source markdown exceeds the 25 MiB export limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/openai/chat/completions:
    post:
      summary: OpenAI-shaped chat-completions adapter that performs OCR
      operationId: openaiChatCompletions
      tags: [OCR]
      description: |
        Drop-in for OpenAI-SDK code that wants vision OCR. Pass an
        `image_url` content part (data URL); Extracto submits an OCR
        job, blocks until it completes (up to 5 minutes), and returns
        the standard OpenAI Chat Completions shape.

        Error responses use the OpenAI envelope (`OpenAIError`) instead
        of the generic Extracto Error shape so OpenAI-SDK clients can
        parse them without special-casing.
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "200":
          description: OpenAI-shaped completion
          content:
            application/json: {}
        "400":
          description: Validation error (OpenAI envelope)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIError" }
        "401":
          description: Missing or invalid bearer token (OpenAI envelope)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIError" }
        "429":
          description: Rate-limited (OpenAI envelope)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAIError" }

  /api/jobs:
    get:
      summary: List the caller's OCR jobs with optional filters
      operationId: listJobs
      tags: [Jobs]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
        - name: q
          in: query
          description: Substring match on fileName. Case-insensitive for ASCII characters (SQLite default LIKE collation).
          schema: { type: string }
        - name: model
          in: query
          description: Substring match on the job's model id. Case-insensitive for ASCII.
          schema: { type: string }
        - name: from
          in: query
          description: Lower bound on createdAt (ISO-8601, inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Upper bound on createdAt (ISO-8601, inclusive). When passed as a bare date (YYYY-MM-DD) the server treats it as inclusive end-of-day UTC.
          schema: { type: string, format: date-time }
        - name: tagIds
          in: query
          description: Comma-separated tag ids. Matches jobs with at least one of these tags.
          schema: { type: string }
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/OcrJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Bulk-delete the caller's jobs
      operationId: deleteJobs
      tags: [Jobs]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
      responses:
        "200":
          description: Number deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }

  /api/jobs/{id}:
    get:
      summary: Fetch a single job (with hydrated text + result)
      operationId: getJob
      tags: [Jobs]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties: { job: { $ref: "#/components/schemas/OcrJob" } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete one job
      operationId: deleteJob
      tags: [Jobs]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }

  /api/v1/jobs/{id}/pages/{pageNumber}:
    get:
      summary: Fetch the edit history for one page on a COMPLETED job
      operationId: getJobPageHistory
      tags: [Jobs]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: pageNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Page edit history (newest first, max 20 entries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageNumber: { type: integer }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        editedAt: { type: string, format: date-time }
                        characterCount: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Replace the markdown of a single page; the previous text is added to the page's history
      operationId: editJobPage
      tags: [Jobs]
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: pageNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000000 }
      responses:
        "200":
          description: Page updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pageNumber: { type: integer }
                  extractedTextLength: { type: integer }
                  historyLength: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/bulk/tags:
    post:
      summary: Apply tags to many jobs in one call
      operationId: bulkTagJobs
      tags: [Jobs, Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobIds, tagIds]
              properties:
                jobIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
                tagIds:
                  type: array
                  items: { type: string }
                mode:
                  type: string
                  enum: [add, replace]
                  default: add
                  description: "'add' is a union (idempotent on duplicates); 'replace' clears existing tags on each job and writes the new set. 'replace' with an empty tagIds array is destructive and strips all tags from the listed jobs."
      responses:
        "200":
          description: Bulk applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  mode: { type: string, enum: [add, replace] }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{id}/tags:
    put:
      summary: Replace the set of tags applied to a job
      operationId: setJobTags
      tags: [Jobs, Tags]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items: { type: string }
                  description: Tag ids owned by the caller. Pass an empty array to clear all tags.
      responses:
        "200":
          description: Tags applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tags:
    get:
      summary: List the caller's tags with per-tag job counts
      operationId: listTags
      tags: [Tags]
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
    post:
      summary: Create or recolor a tag (idempotent on name)
      operationId: createTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 32 }
                color:
                  type: string
                  enum: [slate, blue, green, yellow, orange, red, pink, purple]
      responses:
        "200":
          description: Tag created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag: { $ref: "#/components/schemas/Tag" }

  /api/v1/tags/{id}:
    patch:
      summary: Rename a tag and/or change its color
      operationId: updateTag
      tags: [Tags]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 32 }
                color:
                  type: string
                  enum: [slate, blue, green, yellow, orange, red, pink, purple]
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a tag (cascades job associations)
      operationId: deleteTag
      tags: [Tags]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/saved-searches:
    get:
      summary: List the caller's saved History searches
      operationId: listSavedSearches
      tags: [SavedSearches]
      responses:
        "200":
          description: Saved search list
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedSearches:
                    type: array
                    items: { $ref: "#/components/schemas/SavedSearch" }
    post:
      summary: Create or update a saved search (idempotent on name)
      operationId: createSavedSearch
      tags: [SavedSearches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, filters]
              properties:
                name: { type: string, maxLength: 64 }
                filters: { $ref: "#/components/schemas/SavedSearchFilters" }
      responses:
        "200":
          description: Saved search created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedSearch: { $ref: "#/components/schemas/SavedSearch" }

  /api/v1/saved-searches/{id}:
    patch:
      summary: Rename a saved search and/or update its filters
      operationId: updateSavedSearch
      tags: [SavedSearches]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                filters: { $ref: "#/components/schemas/SavedSearchFilters" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedSearch: { $ref: "#/components/schemas/SavedSearch" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Name conflict
    delete:
      summary: Delete a saved search
      operationId: deleteSavedSearch
      tags: [SavedSearches]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/jobs/{id}/control:
    post:
      summary: Stop a running job
      operationId: controlJob
      tags: [Jobs]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [stop] }
      responses:
        "200":
          description: Stop requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopRequested: { type: boolean }
                  running: { type: boolean }

  /api/jobs/{id}/stream:
    get:
      summary: Server-Sent Events stream of job progress
      operationId: streamJob
      tags: [Jobs]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}

  /api/v1/keys:
    get:
      summary: List the caller's API keys (session-only)
      operationId: listApiKeys
      tags: [Keys]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
                  availableScopes:
                    type: array
                    items: { type: string }
        "403":
          description: Bearer-token requests rejected by design
    post:
      summary: Mint a new API key (session-only; plaintext returned ONCE)
      operationId: createApiKey
      tags: [Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                scopes:
                  type: array
                  items: { type: string }
                rateLimitPerMinute:
                  type: integer
                  minimum: 1
                  maximum: 600
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    allOf:
                      - $ref: "#/components/schemas/ApiKey"
                      - type: object
                        properties: { plaintext: { type: string } }
                  warning: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Bearer-token requests rejected by design (use a session)
        "409":
          description: Per-user key cap reached

  /api/v1/keys/{id}:
    delete:
      summary: Revoke an API key (session-only)
      operationId: revokeApiKey
      tags: [Keys]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties: { revoked: { type: integer } }

  /api/v1/presets:
    get:
      summary: List output presets
      operationId: listPresets
      tags: [Presets]
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/Preset" }
    post:
      summary: Create a preset
      operationId: createPreset
      tags: [Presets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, instruction]
              properties:
                name: { type: string, maxLength: 80 }
                instruction: { type: string, maxLength: 6000 }
                outputFormat:
                  type: string
                  enum: [markdown, json]
                  default: markdown
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { preset: { $ref: "#/components/schemas/Preset" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Per-user preset cap reached

  /api/v1/presets/{id}:
    patch:
      summary: Update a preset (partial)
      operationId: updatePreset
      tags: [Presets]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                instruction: { type: string, maxLength: 6000 }
                outputFormat: { type: string, enum: [markdown, json] }
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                properties: { updated: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      summary: Delete a preset
      operationId: deletePreset
      tags: [Presets]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }

  /api/v1/webhooks:
    get:
      summary: List webhooks
      operationId: listWebhooks
      tags: [Webhooks]
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
    post:
      summary: Register a webhook (signing secret returned ONCE)
      operationId: createWebhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items:
                    type: string
                    enum: [job.completed, job.failed]
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook:
                    allOf:
                      - $ref: "#/components/schemas/Webhook"
                      - type: object
                        properties: { secret: { type: string } }
                  warning: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/webhooks/{id}:
    patch:
      summary: Toggle a webhook active flag
      operationId: updateWebhook
      tags: [Webhooks]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                properties: { updated: { type: integer } }
    delete:
      summary: Delete a webhook
      operationId: deleteWebhook
      tags: [Webhooks]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }

  /api/v1/webhooks/{id}/deliveries:
    get:
      summary: List recent webhook delivery attempts for one webhook
      description: |
        Returns the most recent delivery attempts for the given webhook
        (capped, newest first). Useful for debugging webhook failures.
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Array of delivery records
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        webhookId: { type: string }
                        event: { type: string }
                        url: { type: string }
                        statusCode: { type: integer, nullable: true }
                        ok: { type: boolean }
                        durationMs: { type: integer, nullable: true }
                        errorMessage: { type: string, nullable: true }
                        attemptedAt: { type: string, format: date-time }

  /api/v1/search:
    get:
      summary: Full-text search across the caller's KB-exported jobs
      operationId: search
      tags: [KB]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json: {}

  /api/v1/export/kb:
    post:
      summary: Export an OCR job's text to a vector store
      operationId: exportKb
      tags: [KB]
      description: |
        Requires `KB_EXPORT_ENABLED=1` on the server. The embedding
        endpoint is policy-checked against the same allowlists as the
        OCR providers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbExportRequest" }
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  collectionName: { type: string }
                  chunkCount: { type: integer }
                  embeddingDimensions: { type: integer, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: KB export disabled (set `KB_EXPORT_ENABLED=1`)

  /api/v1/kb/test-connection:
    post:
      summary: Probe a vector store for reachability and auth
      operationId: kbTestConnection
      tags: [KB]
      description: |
        Lightweight GET against a per-store info endpoint (Chroma `/api/v1/heartbeat`,
        Qdrant `/`, Weaviate `/v1/meta`) so the caller can verify the store is reachable
        and the supplied credentials are accepted before running an actual export.
        When `apiKey` is omitted, the server falls back to the saved per-user kb-default
        for the same store kind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, baseUrl]
              properties:
                kind:
                  type: string
                  enum: [chroma, qdrant, weaviate]
                baseUrl:
                  type: string
                  format: uri
                apiKey:
                  type: string
      responses:
        "200":
          description: Probe result (ok=false also returns 200; check the body)
          content:
            application/json:
              schema:
                type: object
                required: [ok, latencyMs, endpoint]
                properties:
                  ok: { type: boolean }
                  latencyMs: { type: integer }
                  endpoint: { type: string }
                  version: { type: string, nullable: true }
                  status: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/export/s3:
    post:
      summary: Export an OCR job's markdown + JSON to the user's S3 bucket
      operationId: exportS3
      tags: [S3]
      description: |
        Uploads `<job-id>.md` and `<job-id>.json` under
        `<configured-prefix>/<keyPrefix or fileName-stem>/` in the bucket
        configured under Settings → S3. Credentials live on the Extracto
        server filesystem and never round-trip to the caller. Endpoint policy
        rejects cloud-metadata IPs, link-local, and (by default) RFC1918 /
        loopback hosts. Set `S3_ALLOW_LOOPBACK=1` for local MinIO sidecars.
        Requires the `s3:write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string }
                keyPrefix: { type: string, nullable: true }
                wait: { type: boolean, default: true, description: "When false returns 202 + {exportId} immediately and the upload runs in the background; subscribe to /api/s3/export/{exportId}/stream for progress." }
      responses:
        "200":
          description: Upload result (when wait=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportId: { type: string }
                  bucket: { type: string }
                  keys: { type: array, items: { type: string } }
                  totalBytes: { type: integer }
        "202":
          description: Upload queued (when wait=false)
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Rate limit exceeded (12/min per user for S3 writes)

  /api/v1/s3/list:
    get:
      summary: List objects in the configured S3 bucket
      operationId: listS3
      tags: [S3]
      description: |
        Paginated listing under `<configured-prefix>/<prefix>/`. By default
        only OCR-able file extensions are returned (`.pdf`, `.png`, `.jpg`,
        `.jpeg`, `.webp`, `.tif`, `.tiff`, `.bmp`, `.gif`, `.heic`,
        `.heif`); pass `all=1` to lift that filter. Requires `s3:read`.
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: token
          in: query
          schema: { type: string }
          description: Continuation token from a prior response's `nextToken`.
        - name: all
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket: { type: string }
                  prefix: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        size: { type: integer }
                        lastModified: { type: string, nullable: true }
                        etag: { type: string, nullable: true }
                  nextToken: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Rate limit exceeded (60/min per user for S3 reads)

  /api/v1/s3/download:
    get:
      summary: Stream an S3 object back to the caller
      operationId: downloadS3
      tags: [S3]
      description: |
        Streams up to 200 MB. The key MUST live under the user's configured
        prefix; cross-prefix or `..` segments are rejected. Requires `s3:read`.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object body
          content:
            application/octet-stream: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Object exceeds 200 MB
        "429":
          description: Rate limit exceeded (60/min per user for S3 reads)

  /api/v1/metrics:
    get:
      summary: Prometheus-format metrics
      operationId: metrics
      tags: [Ops]
      security:
        - metricsBearer: []
      responses:
        "200":
          description: Metrics
          content:
            text/plain: {}
        "401":
          description: Token mismatch
        "503":
          description: METRICS_TOKEN not configured
