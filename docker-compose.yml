services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - docker.env
    network_mode: ${APP_NETWORK_MODE:-host}
    environment:
      APP_NETWORK_MODE: ${APP_NETWORK_MODE:-host}
      AUTH_SECRET: ${AUTH_SECRET:-}
      OBSIDIAN_EXPORT_BASE_DIR: ${OBSIDIAN_EXPORT_BASE_DIR:-/host-vaults}
      OBSIDIAN_EXPORT_HOST_ROOT: ${OBSIDIAN_EXPORT_HOST_ROOT:-./obsidian-vaults}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host-gateway:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
      - ${OBSIDIAN_EXPORT_HOST_ROOT:-./obsidian-vaults}:${OBSIDIAN_EXPORT_BASE_DIR:-/host-vaults}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const res = await fetch('http://127.0.0.1:3000/api/health'); process.exit(res.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 8

volumes:
  sqlite_data:
